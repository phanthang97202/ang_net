<!-- nzClassName="blog-modal": khung modal (header, nút đóng, bo góc) render qua
     CDK overlay, nằm ngoài component nên style của khung ở styles.scss. -->
<nz-modal
  nzClassName="blog-modal"
  [nzVisible]="isOpen"
  nzTitle="Báo cáo bình luận"
  [nzWidth]="560"
  (nzOnCancel)="cancel()">
  <div *nzModalContent class="report">
    <p class="report__hint">
      Chọn lý do bạn cho rằng bình luận này vi phạm tiêu chuẩn cộng đồng.
    </p>

    <!-- Radio thật (ẩn đi) bọc trong label: giữ nguyên điều hướng bằng phím
         mũi tên và cách screen reader đọc của một nhóm radio, chỉ đổi phần
         nhìn thấy thành các ô chọn. -->
    <div class="report__reasons" role="radiogroup" aria-label="Lý do báo cáo">
      @for (item of reasons; track item.value) {
        <label
          class="report__reason"
          [class.report__reason--active]="reason === item.value">
          <input
            class="report__radio"
            type="radio"
            name="report-reason"
            [value]="item.value"
            [(ngModel)]="reason" />
          <span class="report__dot" aria-hidden="true"></span>
          <span class="report__reason-text">{{ item.label }}</span>
        </label>
      }
    </div>

    <label class="report__label" for="report-description">
      Mô tả thêm <span class="report__optional">(không bắt buộc)</span>
    </label>
    <textarea
      id="report-description"
      class="report__description"
      rows="3"
      maxlength="500"
      [(ngModel)]="description"
      [placeholder]="'T_REPORTDESCRIPTION' | translate"></textarea>
    <p class="report__counter">{{ description.length }}/500</p>
  </div>

  <div *nzModalFooter class="report__footer">
    <button type="button" class="report__btn report__btn--ghost" (click)="cancel()">
      Hủy
    </button>
    <button
      type="button"
      class="report__btn report__btn--primary"
      [disabled]="isSending"
      (click)="send()">
      @if (isSending) {
        <span class="report__spinner" aria-hidden="true"></span>
        Đang gửi...
      } @else {
        Gửi báo cáo
      }
    </button>
  </div>
</nz-modal>
