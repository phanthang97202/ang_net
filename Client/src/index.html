<!doctype html>
<html lang="vi" class="app-booting">
  <head>
    <meta charset="utf-8" />
    <title>Phan Thang Blog</title>
    <meta
      name="description"
      content="Blog cá nhân của Phan Thang - chia sẻ bài viết, tin tức và trải nghiệm."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Inline để loading không phụ thuộc Angular hoặc stylesheet tải sau. -->
    <style>
      html.app-booting { overflow: hidden; }
      html.app-booting app-root { visibility: hidden; }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 15% 30%, rgba(255, 218, 184, .45), transparent 55%),
          radial-gradient(ellipse at 85% 70%, rgba(149, 131, 255, .2), transparent 55%),
          linear-gradient(135deg, #fffcf8, #f7f5ff);
        color: #454557;
        font: 500 14px/1.6 'Montserrat', sans-serif;
        transition: opacity .2s ease;
      }
      html[data-theme='dark'] #initial-loader {
        background:
          radial-gradient(ellipse at 15% 30%, rgba(126, 78, 56, .18), transparent 55%),
          radial-gradient(ellipse at 85% 70%, rgba(91, 79, 233, .2), transparent 55%),
          linear-gradient(135deg, #13131f, #191629);
        color: #e0e0eb;
      }
      .initial-loader__content { display: grid; justify-items: center; gap: 16px; padding: 24px; text-align: center; }
      .initial-loader__mark { position: relative; display: grid; place-items: center; width: 76px; height: 76px; }
      .initial-loader__mark::before {
        content: '';
        position: absolute;
        inset: 0;
        border: 3px solid rgba(91, 79, 233, .15);
        border-top-color: #5b4fe9;
        border-radius: 50%;
        animation: initial-loader-spin .8s linear infinite;
      }
      .initial-loader__logo { width: 44px; height: 44px; border-radius: 12px; }
      #initial-loader-status { margin: 0; }
      #initial-loader-status:empty { display: none; }
      #initial-loader-retry { color: #5b4fe9; font-weight: 700; }
      #initial-loader[data-leaving='true'] { opacity: 0; pointer-events: none; }
      #initial-loader[data-failed='true'] .initial-loader__mark::before { animation: none; }
      @keyframes initial-loader-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader { transition: none; }
        .initial-loader__mark::before { animation: none; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/images/phanthangblog_logo.png"
    />

    <!-- Thiếu manifest thì Chrome trên điện thoại không biết gọi site là gì, nên
         lưu vào màn hình chính với nhãn mặc định "Home". -->
    <link rel="manifest" href="assets/manifest.webmanifest" />
    <!-- iOS không đọc icon trong manifest, phải khai riêng bằng apple-touch-icon. -->
    <link rel="apple-touch-icon" href="assets/images/logo.png" />
    <!-- Màu thanh trạng thái trên điện thoại; khớp --color-accent của giao diện. -->
    <meta name="theme-color" content="#5b4fe9" />

    <!-- Trình đọc RSS và các dịch vụ tổng hợp tin dò thẻ này để tìm feed. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Phan Thang Blog"
      href="/rss.xml"
    />

    <meta property="og:locale" content="vi_VN" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Phan Thang Blog" />
    <meta property="og:title" content="Phan Thang Blog" />
    <meta
      property="og:description"
      content="Blog cá nhân của Phan Thang - chia sẻ bài viết, tin tức và trải nghiệm."
    />
    <meta
      property="og:image"
      content="https://phanthang.site/assets/images/logo.png"
    />
    <meta property="og:url" content="https://phanthang.site/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phan Thang Blog" />
    <meta
      name="twitter:description"
      content="Blog cá nhân của Phan Thang - chia sẻ bài viết, tin tức và trải nghiệm."
    />
    <meta
      name="twitter:image"
      content="https://phanthang.site/assets/images/logo.png"
    />
  </head>

  <body>
    <script>
      // Set data-theme trước khi Angular bootstrap để tránh nháy sáng/tối
      // (localStorage key phải khớp environment.themeKey = 'themeKey')
      (function () {
        var theme;
        try { theme = localStorage.getItem('themeKey'); } catch (_) {}
        document.documentElement.setAttribute(
          'data-theme',
          theme === 'dark' ? 'dark' : 'light'
        );
      })();
    </script>
    <div id="initial-loader" role="status" aria-live="polite" aria-label="Đang tải trang">
      <div class="initial-loader__content">
        <div class="initial-loader__mark" aria-hidden="true">
          <img class="initial-loader__logo" src="assets/images/phanthangblog_logo.png" width="44" height="44" alt="" />
        </div>
        <p id="initial-loader-status"></p>
        <a id="initial-loader-retry" href="" hidden>Tải lại trang</a>
      </div>
    </div>
    <app-root inert aria-hidden="true" aria-busy="true"></app-root>
    <script>
      // Nếu bundle không tải được, vẫn có lối thoát thay vì loading vô hạn.
      window.setTimeout(function () {
        var loader = document.getElementById('initial-loader');
        if (loader && loader.dataset.leaving !== 'true') {
          loader.dataset.failed = 'true';
          document.getElementById('initial-loader-status').textContent =
            'Trang đang tải lâu hơn bình thường.';
          document.getElementById('initial-loader-retry').hidden = false;
        }
      }, 20000);
    </script>
    <noscript>
      <style>#initial-loader, app-root { display: none; }</style>
      Vui lòng bật JavaScript để sử dụng website.
    </noscript>
  </body>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</html>
