<app-error-popup [errorInfo]="errorInfo" [blogStyle]="layoutType !== 'admin'" />
<div *ngIf="isLoading$ | async" class="app__loading">
  <app-spinner size="large"></app-spinner>
</div>

<nz-layout *ngIf="layoutType === 'none'" class="layout">
  <nz-content>
    <router-outlet></router-outlet>
  </nz-content>
</nz-layout>

<!-- Không có nz-layout/nz-content: tránh margin:64.8px 0 mà nz-content áp cho layout 'none' -->
<router-outlet *ngIf="layoutType === 'immersive'"></router-outlet>

<div *ngIf="layoutType === 'user'" class="layout layout--user">
  <div class="ambient-glow ambient-glow--left"></div>
  <div class="ambient-glow ambient-glow--right"></div>
  <app-navbar />
  <router-outlet></router-outlet>
  <app-footer />
</div>

<nz-layout *ngIf="layoutType === 'admin'" class="layout admin-ui">
  <nz-sider
    class="admin-sidebar"
    [nzCollapsed]="true"
    [nzCollapsedWidth]="68"
    [nzTrigger]="null"
    nzCollapsible
    nzWidth="220px">
    <div class="admin-sidebar__brand">
      <a routerLink="/">
        <img
          class="admin-sidebar__logo"
          src="assets/images/logo.png"
          alt="Trang chủ" />
      </a>
    </div>
    <!-- Menu dựng từ dashboardMenuFiltered: mục nào người dùng không có quyền thì
         không hiện, nhóm rỗng thì ẩn cả nhóm. Trước đây hiện cứng đủ 9 mục cho
         bất kỳ ai vào được, bấm vào mới báo lỗi.
         Mục Order đã bỏ: route /dashboard/order không tồn tại. -->
    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li
        *ngFor="let group of dashboardMenuFiltered"
        nz-submenu
        routerLinkActive="admin-menu-active"
        [nzTitle]="group.title"
        [nzIcon]="group.icon">
        <ul>
          <li *ngFor="let item of group.children" nz-menu-item>
            <a [routerLink]="item.path">{{ item.title }}</a>
          </li>
        </ul>
      </li>
    </ul>
    <div class="admin-sidebar__footer">
      <div class="admin-sidebar__language">
        <app-switch-lang />
      </div>
      <button
        class="admin-sidebar__logout"
        (click)="handleLogout()"
        nz-button
        nz-tooltip
        nzTooltipTitle="Đăng xuất"
        [nzType]="'text'"
        aria-label="Đăng xuất">
        <span nz-icon nzType="logout" nzTheme="outline"></span>
      </button>
    </div>
  </nz-sider>

  <nz-content class="admin__layout--content">
    <router-outlet></router-outlet>
  </nz-content>
</nz-layout>

<!-- Ẩn ở layout 'immersive' (Reels): trang đó đã bỏ navbar/footer để chiếm trọn
     màn hình, và mép phải là chỗ của nút lên/xuống + panel bình luận -->
<ng-container
  *ngIf="
    authService.getToken() &&
    authService.hasPermission('chat.view') &&
    layoutType !== 'immersive'
  ">
  <!-- Nút Chat -->
  @defer (when authService.hasPermission('chat.view')) {
    <app-chat-widget />
  }
</ng-container>
