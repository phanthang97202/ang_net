<div class="reel-item">
  <!-- Khung video dọc 9:16 căn giữa, giống layout TikTok web -->
  <div
    class="reel-item__stage"
    role="button"
    tabindex="0"
    (click)="onStageTap()"
    (keydown.enter)="togglePlay()"
    (keydown.space)="togglePlay()">
    @if (isMounted) {
      @if (isVideo) {
        <video
          #videoRef
          class="reel-item__media"
          [src]="mediaUrl"
          [muted]="isMuted"
          [poster]="coverUrl"
          [preload]="isActive ? 'auto' : 'metadata'"
          loop
          playsinline
          (canplay)="onCanPlay()"
          (play)="onPlay()"
          (pause)="onPause()"></video>

        @if (!isPlaying) {
          <span class="reel-item__play-overlay">
            <span nz-icon nzType="caret-right" nzTheme="fill"></span>
          </span>
        }

        @if (showHeartBurst) {
          <span class="reel-item__heart-burst">
            <span nz-icon nzType="heart" nzTheme="fill"></span>
          </span>
        }

        <!-- Nút tiếng nằm trong video như TikTok, hiện rõ khi rê chuột vào.
             Dùng lại đúng cặp icon loa của music-player cho đồng bộ toàn app:
             icon 'sound'/'notification' của ng-zorro nhìn gần giống nhau, khó phân biệt bật/tắt. -->
        <button
          type="button"
          class="reel-item__mute"
          (click)="onMute($event)"
          [attr.aria-label]="isMuted ? 'Bật tiếng' : 'Tắt tiếng'">
          @if (isMuted) {
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 4L9.91 6.09 12 8.18V4zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM19 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm-2.5-8.77v2.06c2.89.86 5 3.54 5 6.71 0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77z"></path>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"></path>
            </svg>
          }
        </button>
      } @else {
        <img class="reel-item__media" [src]="mediaUrl" [alt]="reel.Caption" />
      }
    } @else if (coverUrl) {
      <img class="reel-item__media" [src]="coverUrl" [alt]="reel.Caption" />
    } @else {
      <div class="reel-item__media reel-item__media--placeholder"></div>
    }

    <!-- Thông tin tác giả + caption -->
    <div class="reel-item__info">
      <div class="reel-item__author">
        @if (avatarUrl) {
          <img class="reel-item__avatar" [src]="avatarUrl" alt="" />
        } @else {
          <span class="reel-item__avatar reel-item__avatar--fallback">{{
            authorInitial
          }}</span>
        }
        <span class="reel-item__username">{{ reel.UserFullName }}</span>
      </div>
      @if (reel.Caption) {
        <p class="reel-item__caption">{{ reel.Caption }}</p>
      }
    </div>
  </div>

  <!-- Thanh hành động dọc bên phải khung video -->
  <div class="reel-item__actions">
    <button
      type="button"
      class="reel-item__action"
      [class.is-liked]="reel.IsLikedByMe"
      (click)="onLike()"
      aria-label="Thích">
      <span
        class="reel-item__action-icon"
        nz-icon
        nzType="heart"
        nzTheme="fill"></span>
      <span class="reel-item__action-count">{{
        formatCount(reel.LikeCount)
      }}</span>
    </button>

    <button
      type="button"
      class="reel-item__action"
      (click)="onOpenComments()"
      aria-label="Bình luận">
      <span
        class="reel-item__action-icon"
        nz-icon
        nzType="message"
        nzTheme="fill"></span>
      <span class="reel-item__action-count">{{
        formatCount(reel.CommentCount)
      }}</span>
    </button>

    <div class="reel-item__action" aria-label="Lượt xem">
      <span
        class="reel-item__action-icon"
        nz-icon
        nzType="eye"
        nzTheme="fill"></span>
      <span class="reel-item__action-count">{{
        formatCount(reel.ViewCount)
      }}</span>
    </div>
  </div>
</div>
