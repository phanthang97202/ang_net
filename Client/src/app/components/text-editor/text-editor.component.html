<div>
  <div class="editor-container">
    <quill-editor
      format="html"
      [modules]="editorModules"
      [customModules]="customModules"
      [styles]="{ height: '500px' }"
      [(ngModel)]="content"
      (onEditorChanged)="handleonEditorChanged($event)"
      (onContentChanged)="handleContentChanged($event)"
      (onEditorCreated)="onEditorCreated($event)">
    </quill-editor>
  </div>
</div>
