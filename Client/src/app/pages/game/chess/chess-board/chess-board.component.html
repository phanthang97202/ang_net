<div class="chess-board-frame">
  <div class="chess-board__ranks" aria-hidden="true">
    <span *ngFor="let row of rows">{{ row[0].square[1] }}</span>
  </div>
  <div class="chess-board" [class.chess-board--interactive]="interactive">
    <div class="chess-board__row" *ngFor="let row of rows">
      <button
        type="button"
        *ngFor="let cell of row"
        class="chess-board__square"
        [disabled]="!interactive"
        [attr.aria-label]="
          cell.square +
          (cell.piece
            ? ' ' +
              ((cell.pieceColor === 'w'
                ? 'T_CHESS_COLOR_WHITE'
                : 'T_CHESS_COLOR_BLACK'
              ) | translate) +
              ' ' +
              ('T_CHESS_PIECE_' + cell.piece | uppercase | translate)
            : '')
        "
        [attr.aria-pressed]="cell.isSelected"
        [class.chess-board__square--light]="cell.isLight"
        [class.chess-board__square--dark]="!cell.isLight"
        [class.chess-board__square--last-move-to]="cell.isLastMoveTo"
        [class.chess-board__square--selected]="cell.isSelected"
        [class.chess-board__square--legal]="cell.isLegalTarget"
        [class.chess-board__square--capture]="
          cell.isLegalTarget && !!cell.piece
        "
        (click)="onSquareClick(cell.square)">
        <img
          *ngIf="cell.piece && cell.pieceColor"
          class="chess-board__piece"
          [src]="preferences.pieceUrl(cell.pieceColor, cell.piece)"
          alt=""
          draggable="false"
          aria-hidden="true" />
        <span
          *ngIf="cell.isLastMoveFrom"
          class="chess-board__last-move-dot"></span>
        <span
          *ngIf="cell.isLegalTarget && !cell.piece"
          class="chess-board__dot"></span>
      </button>
    </div>

    <div class="chess-board__promotion" *ngIf="pendingPromotion">
      <div
        class="chess-board__promotion-panel"
        role="dialog"
        [attr.aria-label]="'T_CHESS_PROMOTION' | translate">
        <button
          type="button"
          *ngFor="let piece of promotionChoices"
          class="chess-board__promotion-btn"
          [attr.aria-label]="'T_CHESS_PROMOTE_' + piece | uppercase | translate"
          (click)="choosePromotion(piece)">
          <img
            [src]="
              preferences.pieceUrl(orientation === 'white' ? 'w' : 'b', piece)
            "
            alt=""
            draggable="false" />
        </button>
        <button
          type="button"
          class="chess-board__promotion-cancel"
          [attr.aria-label]="'T_CANCEL' | translate"
          (click)="cancelPromotion()">
          ✕
        </button>
      </div>
    </div>
  </div>
  <div class="chess-board__files" aria-hidden="true">
    <span *ngFor="let cell of rows[0]">{{ cell.square[0] }}</span>
  </div>
</div>
