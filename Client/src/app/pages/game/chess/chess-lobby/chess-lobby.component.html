<div class="chess-page chess-lobby">
  <section class="chess-lobby__intro" aria-labelledby="chess-lobby-title">
    <h1 id="chess-lobby-title">{{ 'T_CHESS' | translate }}</h1>
    <p class="chess-description">{{ 'T_CHESS_LOBBY_DESC' | translate }}</p>
    <div class="chess-lobby__preview" aria-hidden="true">
      <app-chess-board [fen]="previewFen" />
    </div>
  </section>

  <section
    class="chess-card chess-lobby__card"
    aria-labelledby="chess-create-title">
    <h2 id="chess-create-title" class="chess-card-title">
      {{ 'T_CHESS_CREATE_ROOM' | translate }}
    </h2>
    <label for="chess-player-name" class="blog-label">{{
      'T_CHESS_YOUR_NAME' | translate
    }}</label>
    <input
      id="chess-player-name"
      class="blog-input"
      [(ngModel)]="playerName"
      [placeholder]="'T_CHESS_YOUR_NAME_PLACEHOLDER' | translate"
      [disabled]="isCreating"
      [attr.aria-invalid]="!!errorMessage"
      [attr.aria-describedby]="errorMessage ? 'chess-create-error' : null"
      (keyup.enter)="createRoom()"
      maxlength="30"
      autocomplete="nickname" />
    <p
      id="chess-create-error"
      class="chess-error"
      *ngIf="errorMessage"
      role="alert">
      {{ errorMessage }}
    </p>
    <app-chess-piece-picker class="chess-piece-settings" />
    <button
      type="button"
      class="blog-btn blog-btn--primary chess-submit"
      [disabled]="isCreating"
      [attr.aria-busy]="isCreating"
      (click)="createRoom()">
      <span *ngIf="isCreating" class="blog-spinner" aria-hidden="true"></span>
      <span *ngIf="!isCreating" nz-icon nzType="plus" aria-hidden="true"></span>
      {{ 'T_CHESS_CREATE_ROOM' | translate }}
    </button>
    <div class="chess-lobby__divider">{{ 'T_CHESS_OR' | translate }}</div>
    <a
      class="blog-btn chess-lobby__computer"
      routerLink="/game/chess/vs-computer">
      <span nz-icon nzType="desktop" aria-hidden="true"></span>
      {{ 'T_CHESS_VS_COMPUTER' | translate }}
    </a>
  </section>
</div>
