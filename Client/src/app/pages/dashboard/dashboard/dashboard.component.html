<!-- Nền gradient hiện ngay, ảnh nền phủ lên khi đã tải xong -->
<div class="dashboard-background" [class.is-loaded]="imageLoaded">
  @if (backgroundImageUrl$ | async; as url) {
    <img
      class="dashboard-background__image"
      [src]="url"
      alt="Ảnh nền trang quản trị"
      (load)="imageLoaded = true"
      (error)="useFallbackImage($event)" />
  }
</div>
