<section class="post-list">
  <p class="post-list-heading">
    <span *ngIf="filterLabelKey; else allPostsHeading">
      {{ filterLabelKey | translate }}
      <strong>&ldquo;{{ filterValue }}&rdquo;</strong>
    </span>
    <ng-template #allPostsHeading>
      <span>{{ 'T_ALLPOSTS' | translate }}</span>
    </ng-template>
    <span class="post-list-heading-line"></span>
  </p>

  <div class="post-list-tabs" role="group">
    <button
      type="button"
      class="post-list-tab"
      *ngFor="let tab of sortTabs"
      [class.active]="tab.value === sort"
      [attr.aria-pressed]="tab.value === sort"
      (click)="changeSort(tab.value)">
      {{ tab.labelKey | translate }}
    </button>
  </div>

  <ng-container *ngIf="isLoading && posts.length === 0">
    <div class="post-card post-card--skeleton" *ngFor="let i of [1, 2, 3]">
      <div class="post-card-thumb post-card-thumb--skeleton"></div>
      <div class="post-card-body">
        <div class="skeleton-line" style="width: 40%"></div>
        <div class="skeleton-line" style="width: 80%; height: 1.4rem"></div>
        <div class="skeleton-line" style="width: 100%"></div>
        <div class="skeleton-line" style="width: 60%"></div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="posts.length > 0">
    <app-news-card
      *ngFor="let post of posts; trackBy: trackById; let i = index"
      [post]="post"
      [refreshing]="isLoading"
      [revealDelay]="(i % 3) * 90"
      [placeholderColor]="post._placeholderColor || '#5b4fe9'" />

    <div class="post-list-pagination" [class.is-refreshing]="isLoading">
      <pagination
        [pageIndex]="currentPage + 1"
        [itemCount]="itemCount"
        (onPageIndexChange)="handlePageIndexChange($event)"
        [size]="'small'" />
    </div>
  </ng-container>

  <ng-container *ngIf="!isLoading && posts.length === 0">
    <div class="post-list-empty">{{ 'T_NONEWS' | translate }}</div>
  </ng-container>
</section>
