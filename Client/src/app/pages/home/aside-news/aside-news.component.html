<div class="w-full flex flex-col gap-[24px]">
  <!-- Ở trang danh sách, chuyên mục là điều hướng chính nên đặt lên đầu. -->
  <app-category-tree
    *ngIf="!isRelatedMode"
    [currentCategoryId]="categoryId"
    [forceLoading]="isSidebarLoading"
    (loadingChange)="onCategoryLoadingChange($event)"></app-category-tree>

  <!-- Khung bài viết luôn tồn tại trong lúc tải để sidebar không bị hụt mất
       khối đầu tiên. Ở trang chi tiết, danh sách chỉ hiện sau khi cả sidebar
       đã sẵn sàng nên người đọc không thấy dữ liệu chung lóe lên trước. -->
  <div
    *ngIf="showNewsSkeleton || lstNews.length > 0"
    class="bg-[var(--color-bg-card)] rounded-[20px] shadow-[0_2px_16px_var(--color-card-shadow)] p-[24px]"
    [attr.aria-busy]="showNewsSkeleton"
    appScrollReveal>
    <div class="mb-[20px]">
      <p
        class="flex items-center gap-[16px] font-montserrat text-[20px] text-[var(--color-text)] tracking-[.15px] font-extrabold">
        {{ (isRelatedMode ? 'T_RELATEDNEWS' : 'T_RECENTNEWS') | translate }}
        <span
          class="block h-[2px] bg-[var(--color-accent)] flex-1 rounded-full"></span>
      </p>
    </div>

    <div
      *ngIf="showNewsSkeleton"
      class="aside-news-skeleton"
      aria-hidden="true">
      <div class="aside-news-skeleton-item" *ngFor="let item of [1, 2, 3, 4]">
        <span class="aside-news-skeleton-thumb"></span>
        <span class="aside-news-skeleton-copy">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>

    <div *ngIf="!showNewsSkeleton" class="flex flex-col gap-[18px]">
      @for (item of lstNews | slice: 0 : 4; track item) {
        <app-news-item-sm [item]="item" />
      }
    </div>
  </div>

  <!-- Ở trang chi tiết, ưu tiên bài liên quan trước rồi mới tới điều hướng danh mục. -->
  <app-category-tree
    *ngIf="isRelatedMode"
    [currentCategoryId]="categoryId"
    [forceLoading]="isSidebarLoading"
    (loadingChange)="onCategoryLoadingChange($event)"></app-category-tree>

  <app-hot-keywords
    *ngIf="showTopHashTagSkeleton || lstTopHashTag.length > 0"
    [tags]="lstTopHashTag"
    [loading]="showTopHashTagSkeleton"
    appScrollReveal
    [appScrollRevealDelay]="120"></app-hot-keywords>
</div>
