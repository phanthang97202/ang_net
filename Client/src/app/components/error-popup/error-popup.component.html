<ng-template #errorTitle>
  <div class="api-error-heading">
    <span class="api-error-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7.5v5" />
        <circle cx="12" cy="16" r=".8" fill="currentColor" stroke="none" />
      </svg>
    </span>
    <div>
      <span class="api-error-eyebrow">{{
        'T_API_ERROR_LABEL' | translate
      }}</span>
      <h2>{{ 'T_API_ERROR_TITLE' | translate }}</h2>
    </div>
  </div>
</ng-template>
<ng-template #errorContent>
  <p class="api-error-hint">{{ 'T_API_ERROR_HINT' | translate }}</p>
  <section
    class="api-error-details"
    [attr.aria-label]="'T_DETAILS' | translate">
    <h3>{{ errorInfo.title || ('T_DETAILS' | translate) }}</h3>
    <pre tabindex="0" [attr.aria-label]="'T_DETAILS' | translate">{{
      errorInfo.message
    }}</pre>
  </section>
</ng-template>
<ng-template #errorFooter>
  <button type="button" class="api-error-close" (click)="closeModal()">
    {{ 'T_API_ERROR_CLOSE' | translate }}
  </button>
</ng-template>
<ng-template #rawContent>
  <pre class="api-error-raw">{{ errorInfo.message }}</pre>
</ng-template>
