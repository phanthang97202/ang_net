<article
  class="post-card"
  [class.is-refreshing]="refreshing"
  appScrollReveal
  [appScrollRevealDelay]="revealDelay">
  <div class="post-card__thumb">
    <!-- Không có ảnh hoặc ảnh lỗi thì appNewsImg tự thay bằng ảnh mặc định. -->
    <img [appNewsImg]="post.Thumbnail" [alt]="title" />

    <a
      [routerLink]="['/news', post.CategoryNewsId, post.NewsId]"
      class="post-card__thumb-link"
      [attr.aria-label]="title"></a>

    @if (categoryName) {
      <a
        class="post-card__category"
        routerLink="/news"
        [queryParams]="{ categoryId: post.CategoryNewsId }">
        {{ categoryName }}
      </a>
    }
    <span class="post-card__readtime">
      {{ readingTime }} {{ 'T_MINUTESREAD' | translate }}
    </span>
  </div>

  <div class="post-card__body">
    <p class="post-card__meta">
      <span>
        <strong>{{ post.FullName }}</strong>
        {{ 'T_ON' | translate }}
        {{ post.CreatedDTime | date: 'MMMM d, yyyy' }}
      </span>
      <span class="post-card__stats">
        <span
          ><span nz-icon nzType="eye" nzTheme="outline"></span
          >{{ formatCount(post.ViewCount) }}</span
        >
      </span>
    </p>

    <a
      [routerLink]="['/news', post.CategoryNewsId, post.NewsId]"
      class="post-card__title">
      {{ title }}
    </a>

    <p class="post-card__excerpt">{{ description }}</p>

  </div>
</article>
