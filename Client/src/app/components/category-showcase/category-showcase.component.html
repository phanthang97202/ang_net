<!-- API đã loại sẵn danh mục chưa có bài, nên rỗng ở đây nghĩa là blog chưa có
     gì để khám phá - ẩn cả khối thay vì hiện dải trống. -->
<section class="topic-rail" *ngIf="isLoading || categories.length > 0">
  <header class="topic-rail__head">
    <span class="topic-rail__title-line" aria-hidden="true"></span>
    <h2 class="topic-rail__title">{{ 'T_EXPLOREBYTOPIC' | translate }}</h2>
    <span class="topic-rail__title-line" aria-hidden="true"></span>
  </header>

  <!-- Loading skeleton -->
  <div class="topic-rail__track topic-rail__track--skeleton" *ngIf="isLoading">
    <div
      class="topic-chip topic-chip--skeleton"
      *ngFor="let i of [1, 2, 3, 4, 5, 6]"></div>
  </div>

  <!-- Danh mục có thể khá dài nên dải này cuộn ngang: hai nút điều hướng trên
       desktop, vuốt tay trên cảm ứng, và luôn snap vào mép thẻ. -->
  <div class="topic-rail__slider" *ngIf="!isLoading">
    <button
      type="button"
      class="topic-rail__nav topic-rail__nav--prev"
      [disabled]="!canScrollPrev"
      [attr.aria-label]="'T_PREVIOUSTOPICS' | translate"
      (click)="scrollByPage(-1)">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="topic-rail__viewport" #viewport (scroll)="syncScrollState()">
      <div class="topic-rail__track">
        <a
          class="topic-chip"
          *ngFor="let category of categories; trackBy: trackById; let i = index"
          routerLink="/news"
          [queryParams]="{ categoryId: category.NewsCategoryId }"
          appScrollReveal
          [appScrollRevealDelay]="(i % 6) * 60">
          <span class="topic-chip__icon" [style.background]="getTopicColor(i)">
            <img
              *ngIf="category.NewsCategoryLogo; else fallbackCategoryIcon"
              [src]="category.NewsCategoryLogo"
              [alt]="getCategoryName(category)" />
            <ng-template #fallbackCategoryIcon>
              <svg viewBox="0 0 24 24" fill="#fff">
                <path
                  [attr.d]="
                    getTopicIconPath(getCategoryName(category), i)
                  "></path>
              </svg>
            </ng-template>
          </span>

          <strong class="topic-chip__name">
            {{ getCategoryName(category) }}
          </strong>
        </a>
      </div>
    </div>

    <button
      type="button"
      class="topic-rail__nav topic-rail__nav--next"
      [disabled]="!canScrollNext"
      [attr.aria-label]="'T_NEXTTOPICS' | translate"
      (click)="scrollByPage(1)">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>
</section>
