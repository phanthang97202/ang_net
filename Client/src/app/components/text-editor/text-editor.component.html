<div
  class="editor-container"
  [class.editor-container--note]="variant === 'note'">
  <div
    *ngIf="variant === 'full'"
    class="editor-extra-tools"
    role="group"
    [attr.aria-label]="'T_EDITOR_EMBED_TOOLS' | translate">
    <button type="button" (click)="insertEmbed('iframe')">
      {{ 'T_EDITOR_EMBED_VIDEO' | translate }}
    </button>
    <button type="button" (click)="insertEmbed('pdf')">
      {{ 'T_EDITOR_EMBED_PDF' | translate }}
    </button>
  </div>

  <ckeditor
    *ngIf="editorStylesReady"
    [editor]="Editor"
    [config]="editorConfig"
    [(ngModel)]="content"
    (ready)="onReady($event)"
    (change)="handleContentChanged($event)">
  </ckeditor>
  <p *ngIf="editorStylesError" role="alert">{{ editorStylesError }}</p>

  <p *ngIf="variant === 'full'" class="editor-help">
    {{ 'T_EDITOR_SOURCE_HELP_PREFIX' | translate }}
    <strong>&lt;/&gt;</strong>
    {{ 'T_EDITOR_SOURCE_HELP_SUFFIX' | translate }}
  </p>
</div>
