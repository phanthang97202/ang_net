<section class="newsletter" appScrollReveal>
  <h2 class="newsletter-title">
    {{ 'T_NEWSLETTERTITLE' | translate }}
    <span class="accent">{{ 'T_NEWSLETTERTITLEACCENT' | translate }}</span>
  </h2>
  <p class="newsletter-subtitle">{{ 'T_NEWSLETTERSUBTITLE' | translate }}</p>

  <!-- Success state -->
  <div *ngIf="isSuccess" class="newsletter-success">
    <span class="text-3xl">🎉</span>
    <p class="newsletter-success-title">
      {{ 'T_SUBSCRIBESUCCESS' | translate }}
    </p>
    <p class="newsletter-success-text">
      {{ 'T_SUBSCRIBESUCCESSDESC' | translate }}
    </p>
  </div>

  <!-- Form -->
  <ng-container *ngIf="!isSuccess">
    <div class="newsletter-form">
      <input
        type="email"
        [placeholder]="'T_ENTERYOUREMAIL' | translate"
        [(ngModel)]="form.email"
        [disabled]="isLoading"
        (keyup.enter)="handleSubmit()"
        class="newsletter-input" />
      <button
        (click)="handleSubmit()"
        [disabled]="isLoading"
        class="newsletter-btn">
        <span *ngIf="!isLoading">{{ 'T_SUBSCRIBE' | translate }}</span>
        <span *ngIf="isLoading" class="flex items-center gap-2">
          <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4" />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v8z" />
          </svg>
          {{ 'T_SENDING' | translate }}
        </span>
      </button>
    </div>

    <p *ngIf="errorMsg" class="newsletter-error">{{ errorMsg }}</p>
  </ng-container>
</section>
