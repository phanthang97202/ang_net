<main class="reels" [attr.aria-busy]="isLoading">
  <div class="reels__viewport" #viewport>
    @for (reel of lstReels; track reel.ReelId; let i = $index) {
      <article
        class="reels__slide"
        #reelHost
        [attr.data-index]="i"
        [attr.aria-label]="reel.Caption || reel.UserFullName">
        <app-reel-item
          [reel]="reel"
          [isActive]="i === activeIndex"
          [isMuted]="isMuted"
          [isMounted]="isMounted(i)"
          [hasPrevious]="i > 0"
          [hasNext]="i < lstReels.length - 1"
          (previousRequested)="scrollToIndex(i - 1)"
          (nextRequested)="scrollToIndex(i + 1)"
          (likeToggled)="onLikeToggled($event)"
          (doubleTapLiked)="onDoubleTapLiked($event)"
          (commentsOpened)="openComments($event)"
          (shareRequested)="shareReel($event)"
          (deleted)="onReelDeleted($event)"
          (muteToggled)="toggleMute()">
          @if (i === activeIndex) {
            <div
              class="reels__comments-panel"
              [class.is-open]="commentsReel?.ReelId === reel.ReelId">
              <app-reel-comments
                [reel]="reel"
                [embedded]="true"
                [autoFocus]="false"
                [currentUserAvatar]="accountAvatar"
                [currentUserInitial]="accountInitial"
                (closed)="closeComments()"
                (commentAdded)="onCommentAdded(reel)" />
            </div>
          }
        </app-reel-item>
      </article>
    }

    @if (!isLoading && lstReels.length === 0) {
      <div class="reels__empty" role="status">
        {{ 'T_NOREELS' | translate }}
      </div>
    }
  </div>
</main>
