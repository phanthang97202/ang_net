<div class="master__container">
  <app-breadcrumb
    [title]="mode === 'edit' ? 'Edit Blog' : 'Create Blog'"
    [buttons]="listButtonsHeader" />

  <form nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()">
    <div nz-row [nzGutter]="[24, 24]" class="items-start blogpost__container">
      <div nz-col [nzXs]="24" [nzMd]="8">
        <div class="blogpost__panel">
          <nz-form-item class="status-toggle">
            <nz-form-label nzLabelAlign="left" [nzXs]="24" [nzMd]="8">{{
              'T_FLAGACTIVE' | translate
            }}</nz-form-label>
            <nz-form-control [nzXs]="24" [nzMd]="16">
              <nz-switch
                formControlName="FlagActive"
                [nzCheckedChildren]="'T_PUBLISHED' | translate"
                [nzUnCheckedChildren]="'T_DRAFT' | translate"></nz-switch>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label
              nzLabelAlign="left"
              [nzXs]="24"
              [nzMd]="8"
              nzRequired
              >{{ 'T_CATEGORYNEWSID' | translate }}</nz-form-label
            >
            <nz-form-control
              [nzXs]="24"
              [nzMd]="16"
              nzValidatingTip="Validating..."
              nzErrorTip="Required!">
              <nz-tree-select
                formControlName="CategoryNewsId"
                [nzNodes]="nodes"
                nzShowSearch
                nzDefaultExpandAll
                [nzPlaceHolder]="'T_PLEASESELECT' | translate"></nz-tree-select>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label
              nzLabelAlign="left"
              [nzXs]="24"
              [nzMd]="8"
              nzRequired
              >{{ 'T_THUMNAIL' | translate }}</nz-form-label
            >
            <nz-form-control
              [nzXs]="24"
              [nzMd]="16"
              nzValidatingTip="Validating..."
              nzErrorTip="Required!">
              <app-upload-common
                [imageUrl]="validateForm.value.Thumbnail || ''"
                (_onClick)="handleUploadFile($event)" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-label nzLabelAlign="left" [nzXs]="24" [nzMd]="8">{{
              'T_LSTREFFILENEWS' | translate
            }}</nz-form-label>
            <nz-form-control [nzXs]="24" [nzMd]="16">
              <nz-upload
                nzAction="https://www.mocky.io/v2/5cc8019d300000980a055e76"
                [(nzFileList)]="lstRefFileNews">
                <button nz-button type="button">
                  <span nz-icon nzType="upload"></span>
                  {{ 'T_UPLOAD' | translate }}
                </button>
              </nz-upload>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div nz-col [nzXs]="24" [nzMd]="16">
        <div class="blogpost__panel blogpost__editor-panel">
          <nz-tabset>
            <nz-tab nzTitle="Tiếng Việt">
              <div class="blogpost__translation-pane">
                <nz-form-item>
                  <nz-form-label nzRequired>Tiêu đề</nz-form-label>
                  <nz-form-control nzErrorTip="Tiêu đề tiếng Việt là bắt buộc!">
                    <input
                      nz-input
                      formControlName="ShortTitle"
                      placeholder="Nhập tiêu đề bài viết" />
                  </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                  <nz-form-label nzRequired>Mô tả ngắn</nz-form-label>
                  <nz-form-control nzErrorTip="Mô tả tiếng Việt là bắt buộc!">
                    <nz-textarea-count [nzMaxCharacterCount]="100">
                      <textarea
                        rows="3"
                        nz-input
                        formControlName="ShortDescription"
                        placeholder="Nhập mô tả ngắn"></textarea>
                    </nz-textarea-count>
                  </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                  <nz-form-label nzRequired>Nội dung</nz-form-label>
                  <nz-form-control
                    nzErrorTip="Nội dung tiếng Việt là bắt buộc!">
                    <app-text-editor
                      *ngIf="isDataLoaded"
                      [initContentBody]="contentBody"
                      (onContentChanged)="handleContentChangedEditor($event)" />
                  </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                  <nz-form-label>Hashtag</nz-form-label>
                  <nz-form-control>
                    <nz-select
                      formControlName="LstHashTagNews"
                      nzMode="tags"
                      nzAllowClear
                      [nzTokenSeparators]="[',']"
                      nzPlaceHolder="Nhập hashtag tiếng Việt">
                      <nz-option
                        *ngFor="let tag of hashtagSuggestions"
                        [nzValue]="tag"
                        [nzLabel]="tag"></nz-option>
                    </nz-select>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </nz-tab>

            <nz-tab nzTitle="English">
              <div class="blogpost__translation-pane">
                <p class="blogpost__translation-hint">
                  Optional. If you add an English translation, complete all
                  three fields.
                </p>

                <nz-form-item>
                  <nz-form-label>Title</nz-form-label>
                  <nz-form-control>
                    <input
                      nz-input
                      formControlName="ShortTitleEn"
                      placeholder="Enter the English title" />
                  </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                  <nz-form-label>Short description</nz-form-label>
                  <nz-form-control>
                    <nz-textarea-count [nzMaxCharacterCount]="100">
                      <textarea
                        rows="3"
                        nz-input
                        formControlName="ShortDescriptionEn"
                        placeholder="Enter the English summary"></textarea>
                    </nz-textarea-count>
                  </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                  <nz-form-label>Content</nz-form-label>
                  <nz-form-control>
                    <app-text-editor
                      *ngIf="isDataLoaded"
                      [initContentBody]="contentBodyEn"
                      (onContentChanged)="
                        handleContentChangedEditorEn($event)
                      " />
                  </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                  <nz-form-label>Hashtags</nz-form-label>
                  <nz-form-control>
                    <nz-select
                      formControlName="LstHashTagNewsEn"
                      nzMode="tags"
                      nzAllowClear
                      [nzTokenSeparators]="[',']"
                      nzPlaceHolder="Enter English hashtags">
                      <nz-option
                        *ngFor="let tag of hashtagSuggestionsEn"
                        [nzValue]="tag"
                        [nzLabel]="tag"></nz-option>
                    </nz-select>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </nz-tab>
          </nz-tabset>

          <div *ngIf="!isDataLoaded" class="loading-editor">
            <app-spinner></app-spinner>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
