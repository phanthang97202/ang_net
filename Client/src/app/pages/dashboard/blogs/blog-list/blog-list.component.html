<div class="master__container">
  <app-breadcrumb title="Blog" [buttons]="listButtonsHeader" />

  <nz-layout>
    <nz-content>
      <nz-table
        nzShowSizeChanger
        [nzData]="dataSource"
        [nzFrontPagination]="false"
        [nzTotal]="total"
        [nzPageIndex]="pageIndex"
        [nzPageSize]="pageSize"
        [nzLoading]="tableLoading"
        (nzQueryParams)="onQueryParamsChange($event)">
        <thead>
          <tr>
            <th nzColumnKey="NewsId" [nzSortFn]="true"></th>
            <th nzColumnKey="NewsId" [nzSortFn]="true">Idx</th>
            <th nzColumnKey="ShortTitle" [nzSortFn]="true">ShortTitle</th>
            <th nzColumnKey="FullName" [nzFilterFn]="true">FullName</th>
            <th nzColumnKey="ViewCount" [nzFilterFn]="true">ViewCount</th>
            <th nzColumnKey="CreatedDTime" [nzFilterFn]="true">CreatedDTime</th>
            <th nzColumnKey="FlagActive" [nzSortFn]="true">FlagActive</th>
            <th nzWidth="110px">Ghim</th>
            <th nzWidth="150px">Gửi thư</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of dataSource; let i = index">
            <!-- Chỉ tác giả mới thấy nút sửa. Nút xóa đã bỏ hẳn: nó gọi nhầm API
                 xóa tỉnh/thành (MstProvince/Delete) chứ chưa bao giờ xóa được
                 bài, và backend cũng chưa có endpoint xóa bài viết. -->
            <td>
              <app-button-common
                *ngIf="canEdit(data)"
                [iconType]="'edit'"
                [iconTheme]="'outline'"
                [nzType]="'text'"
                (_onClick)="handleDetail(data)"></app-button-common>
            </td>
            <td>
              {{ (pageIndex - 1) * pageSize + i + 1 }}
            </td>
            <td>
              {{ data.ShortTitle }}
            </td>
            <td>
              {{ data.FullName }}
            </td>
            <td>
              {{ data.ViewCount }}
            </td>
            <td>{{ data.CreatedDTime }}</td>
            <td>
              <app-tag-status
                [sttValue]="
                  data.FlagActive ? 'ACTIVE' : 'INACTIVE'
                "></app-tag-status>
            </td>
            <!-- Ghim là quyết định biên tập của cả trang, không giới hạn theo tác
                 giả như nút sửa - ai có quyền sửa bài đều ghim được bài bất kỳ. -->
            <td>
              <nz-switch
                [ngModel]="data.IsPinned"
                (ngModelChange)="handleTogglePin(data, $event)"
                nzSize="small"></nz-switch>
              <span *ngIf="data.IsPinned" class="blog__pin-order">
                #{{ data.PinOrder }}
              </span>
            </td>

            <!-- Gửi mail báo bài mới cho người đăng ký. Gửi xong là không thu hồi
                 được nên nút khoá hẳn sau lần đầu, chỉ còn hiện ngày đã gửi. -->
            <td>
              <span *ngIf="data.NotifiedAt" class="blog__notified">
                <span nz-icon nzType="check" nzTheme="outline"></span>
                Đã gửi {{ data.NotifiedAt | localeDTime: 'dd-mm-yy' }}
              </span>

              <button
                *ngIf="!data.NotifiedAt"
                nz-button
                nzType="default"
                nzSize="small"
                [disabled]="!data.FlagActive"
                [attr.title]="
                  data.FlagActive
                    ? 'Gửi mail báo bài này cho người đăng ký'
                    : 'Bài chưa xuất bản thì chưa gửi được'
                "
                nz-popconfirm
                [nzPopconfirmTitle]="
                  'Gửi mail báo bài này cho tất cả người đăng ký? Gửi rồi không thu hồi được.'
                "
                nzOkText="Gửi"
                nzCancelText="Huỷ"
                (nzOnConfirm)="handleNotifySubscribers(data)">
                <span nz-icon nzType="mail" nzTheme="outline"></span>
                Gửi
              </button>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </nz-content>
  </nz-layout>
</div>
