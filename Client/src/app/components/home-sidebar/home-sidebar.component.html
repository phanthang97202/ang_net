<aside class="sidebar">
  <!-- About -->
  <div class="sidebar-card">
    <span class="sidebar-label">{{ 'T_INTRODUCTION' | translate }}</span>

    <div class="about-head">
      <img
        *ngIf="intro.avatar"
        class="about-avatar"
        [src]="intro.avatar"
        [alt]="intro.name" />
      <div>
        <p class="about-name">{{ intro.name }}</p>
        <p class="about-role" *ngIf="intro.shortDescription">
          {{ intro.shortDescription }}
        </p>
      </div>
    </div>

    <p class="about-bio" *ngIf="intro.description">{{ intro.description }}</p>

    <p class="about-location" *ngIf="intro.address">
      <span class="about-icon">📍</span> {{ intro.address }}
    </p>

    <app-social-links [items]="socials"></app-social-links>
  </div>

  <!-- Featured Posts -->
  <div class="sidebar-card" *ngIf="featuredImages.length > 0">
    <span class="sidebar-label">{{ 'T_FEATUREDIMAGES' | translate }}</span>

    <div class="featured-post">
      <!-- Các layer ảnh xếp chồng, crossfade opacity khi đổi slide (giống
           discovery-banner) - 1 <img> duy nhất đổi [src] không tạo được
           crossfade vì ảnh cũ biến mất ngay khi ảnh mới được gán. -->
      <div class="featured-post-bg-layers">
        <div
          *ngFor="let img of featuredImages; let i = index"
          class="featured-post-bg"
          [class.is-active]="i === activeIndex"
          [style.background-image]="'url(' + img.image + ')'"></div>
      </div>
      <div class="featured-post-overlay"></div>
      <div class="featured-post-content">
        <p class="featured-post-title">
          {{ featuredImages[activeIndex].caption }}
        </p>
      </div>
      <div class="featured-post-dots" *ngIf="featuredImages.length > 1">
        <span
          *ngFor="let img of featuredImages; let i = index"
          class="dot"
          [class.active]="i === activeIndex"
          (click)="setActive(i)"></span>
      </div>
    </div>
  </div>
</aside>
