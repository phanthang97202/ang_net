<div class="article-container">
  <!-- Mục lục -->
  <app-news-toc-list
    [content]="content"
    [containerId]="'content-container'"
    *ngIf="showToc && content">
  </app-news-toc-list>

  <!-- Nội dung bài viết -->
  <div
    id="content-container"
    class="content-display ck-content ql-editor"
    [innerHTML]="sanitizedContent"></div>
</div>
