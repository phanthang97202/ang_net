<div class="master__container">
  <app-breadcrumb title="Blog" [buttons]="listButtonsHeader" />

  <nz-layout>
    <nz-content>
      <nz-table
        nzShowSizeChanger
        [nzData]="dataSource"
        [nzFrontPagination]="false"
        [nzTotal]="total"
        [nzPageIndex]="pageIndex"
        [nzPageSize]="pageSize"
        [nzLoading]="tableLoading"
        (nzQueryParams)="onQueryParamsChange($event)">
        <thead>
          <tr>
            <th nzColumnKey="NewsId" [nzSortFn]="true"></th>
            <th nzColumnKey="NewsId" [nzSortFn]="true">Idx</th>
            <th nzColumnKey="ShortTitle" [nzSortFn]="true">ShortTitle</th>
            <th nzColumnKey="FullName" [nzFilterFn]="true">FullName</th>
            <th nzColumnKey="ViewCount" [nzFilterFn]="true">ViewCount</th>
            <th nzColumnKey="CreatedDTime" [nzFilterFn]="true">CreatedDTime</th>
            <th nzColumnKey="FlagActive" [nzSortFn]="true">FlagActive</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of dataSource; let i = index">
            <!-- Chỉ tác giả mới thấy nút sửa. Nút xóa đã bỏ hẳn: nó gọi nhầm API
                 xóa tỉnh/thành (MstProvince/Delete) chứ chưa bao giờ xóa được
                 bài, và backend cũng chưa có endpoint xóa bài viết. -->
            <td>
              <app-button-common
                *ngIf="canEdit(data)"
                [iconType]="'edit'"
                [iconTheme]="'outline'"
                [nzType]="'text'"
                (_onClick)="handleDetail(data)"></app-button-common>
            </td>
            <td>
              {{ (pageIndex - 1) * pageSize + i + 1 }}
            </td>
            <td>
              {{ data.ShortTitle }}
            </td>
            <td>
              {{ data.FullName }}
            </td>
            <td>
              {{ data.ViewCount }}
            </td>
            <td>{{ data.CreatedDTime }}</td>
            <td>
              <app-tag-status
                [sttValue]="
                  data.FlagActive ? 'ACTIVE' : 'INACTIVE'
                "></app-tag-status>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </nz-content>
  </nz-layout>
</div>
