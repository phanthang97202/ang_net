<div class="master__container">
  <app-breadcrumb title="Tỉnh thành" [buttons]="listButtonsHeader" />
  <main class="admin-list-content">
    <section class="admin-list-panel" aria-label="Danh sách tỉnh thành">
      <form
        class="admin-list-toolbar"
        nz-form
        [formGroup]="validateForm"
        (ngSubmit)="handleSearch()">
        <nz-input-group nzPrefixIcon="search">
          <input
            nz-input
            formControlName="Keyword"
            aria-label="Tìm tỉnh thành"
            placeholder="Tìm theo mã hoặc tên tỉnh thành..." />
        </nz-input-group>
        <button nz-button nzType="default" type="submit">Tìm kiếm</button>
        <button
          nz-button
          nzType="text"
          type="button"
          (click)="handleResetSearch()">
          Đặt lại
        </button>
      </form>
      <nz-table
        nzShowSizeChanger
        [nzData]="dataSource"
        [nzFrontPagination]="false"
        [nzLoading]="false">
        <thead>
          <tr>
            <th nzColumnKey="ProvinceCode" [nzSortFn]="true"></th>
            <th nzColumnKey="ProvinceCode" [nzSortFn]="true">Idx</th>
            <th nzColumnKey="ProvinceCode" [nzSortFn]="true">ProvinceCode</th>
            <th nzColumnKey="ProvinceName" [nzFilterFn]="true">ProvinceName</th>
            <th nzColumnKey="FlagActive" [nzSortFn]="true">FlagActive</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of dataSource; let i = index">
            <td>
              <app-button-common
                [iconType]="'edit'"
                [iconTheme]="'outline'"
                [nzType]="'text'"
                (_onClick)="handleDetail(data)"></app-button-common>
              <app-button-common
                [isShowConfirm]="true"
                [iconType]="'delete'"
                [iconTheme]="'outline'"
                [nzType]="'text'"
                (_onClick)="handleDelete(data)"></app-button-common>
            </td>
            <td>
              {{ i + 1 }}
            </td>
            <td>
              {{ data.ProvinceCode }}
            </td>
            <td>{{ data.ProvinceName }}</td>
            <td>
              <app-tag-status
                [sttValue]="
                  data.FlagActive ? 'ACTIVE' : 'INACTIVE'
                "></app-tag-status>
            </td>
          </tr>
        </tbody>
      </nz-table>
    </section>
  </main>
</div>
<app-save-province-popup
  [titlePopup]="titlePopup"
  [formDataSource]="formDataSource"
  [(isOpenPopup)]="_isOpenPopup"
  [titlePopup]="titlePopup"
  (_onSave)="handleSaveForm($event)" />
<app-import-excel-popup
  [(isOpenPopup)]="_isOpenImportExcelPopup"
  (_onUploadFile)="handleUploadFile($event)"
  (_onExportTemplateFile)="handleExportTemplateFile()" />

<ng-template #rezoTriggerTemplate>
  <app-button-common
    [isShowConfirm]="true"
    [iconType]="'search'"
    [nzType]="'text'"></app-button-common>
</ng-template>
