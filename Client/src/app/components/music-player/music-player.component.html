<div class="music-player">
  <audio
    #audioRef
    [src]="audioSrc"
    (play)="onPlay()"
    (pause)="onPause()"
    (timeupdate)="onTimeUpdate()"
    (loadedmetadata)="onLoadedMetadata()"
    (ended)="onEnded()"></audio>

  <div class="music-player-top">
    <div class="music-player-art">
      <img *ngIf="albumArt" [src]="albumArt" [alt]="title" />
      <span *ngIf="!albumArt" class="music-player-art-fallback">♪</span>
    </div>

    <div class="music-player-info">
      <p class="music-player-title">{{ title }}</p>
      <p class="music-player-artist">{{ artist }}</p>
    </div>

    <div class="music-player-wave" [class.is-playing]="isPlaying">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div class="music-player-progress">
    <span class="music-player-time">{{ formatTime(currentTime) }}</span>
    <input
      type="range"
      class="music-player-range"
      min="0"
      max="100"
      step="0.1"
      [value]="progressPercent"
      [style.--progress.%]="progressPercent"
      (input)="onSeekBarChange($event)"
      aria-label="Tiến trình bài hát" />
    <span class="music-player-time">{{ remainingTimeLabel }}</span>
  </div>

  <div class="music-player-controls">
    <a
      class="music-player-btn"
      [class.is-disabled]="!audioSrc"
      [href]="audioSrc || null"
      [download]="title"
      aria-label="Tải xuống">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path>
      </svg>
    </a>

    <button
      type="button"
      class="music-player-btn"
      (click)="seekBack()"
      aria-label="Lùi 10 giây">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="music-player-btn music-player-btn-play"
      (click)="togglePlay()"
      [class.is-disabled]="!audioSrc"
      [attr.aria-label]="isPlaying ? 'Tạm dừng' : 'Phát nhạc'">
      <svg *ngIf="!isPlaying" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"></path>
      </svg>
      <svg *ngIf="isPlaying" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="music-player-btn"
      (click)="seekForward()"
      aria-label="Tiến 10 giây">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="music-player-btn"
      (click)="toggleMute()"
      [attr.aria-label]="isMuted ? 'Bật tiếng' : 'Tắt tiếng'">
      <svg *ngIf="!isMuted" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"></path>
      </svg>
      <svg *ngIf="isMuted" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 4L9.91 6.09 12 8.18V4zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM19 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm-2.5-8.77v2.06c2.89.86 5 3.54 5 6.71 0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77z"></path>
      </svg>
    </button>
  </div>
</div>
