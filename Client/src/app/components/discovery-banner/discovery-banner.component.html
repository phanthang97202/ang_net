<section
  class="hero"
  [class.hero--loading]="configLoading"
  [attr.aria-busy]="configLoading"
  appScrollReveal>
  <!-- Các layer ảnh nền xếp chồng, crossfade opacity khi đổi slide -->
  <div class="hero-bg-layers" *ngIf="!configLoading">
    <div
      *ngFor="let b of banners; let i = index"
      class="hero-bg"
      [class.is-active]="i === activeIndex"
      [style.background-image]="'url(' + b.image + ')'"></div>
  </div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <app-config-skeleton
      *ngIf="configLoading"
      class="hero-text"
      variant="hero"></app-config-skeleton>
    <div class="hero-text" *ngIf="!configLoading">
      <div
        *ngFor="let idx of [activeIndex]; trackBy: trackByActiveIndex"
        class="hero-text-inner hero-text-anim">
        <h1 class="hero-title" [innerHTML]="activeBanner.title"></h1>
        <p class="hero-subtitle">{{ activeBanner.description }}</p>

        <ng-container
          *ngIf="activeBanner.buttonText && activeBanner.buttonLink">
          <a
            *ngIf="!isExternal(activeBanner.buttonLink)"
            [routerLink]="activeBanner.buttonLink"
            class="hero-cta"
            >{{ activeBanner.buttonText }}</a
          >
          <a
            *ngIf="isExternal(activeBanner.buttonLink)"
            [href]="activeBanner.buttonLink"
            target="_blank"
            rel="noopener noreferrer"
            class="hero-cta"
            >{{ activeBanner.buttonText }}</a
          >
        </ng-container>
      </div>

      <div class="hero-dots" *ngIf="banners.length > 1">
        <span
          *ngFor="let b of banners; let i = index"
          class="hero-dot"
          [class.active]="i === activeIndex"
          (click)="setActive(i)"></span>
      </div>
    </div>

    <!-- Danh sách bài hát lấy từ tham số HOME_MUSIC, player tự đọc -->
    <app-music-player class="hero-music"></app-music-player>
  </div>
</section>
