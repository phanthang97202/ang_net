<nz-modal
  [nzVisible]="isOpenPopup"
  [nzTitle]="titlePopup"
  [nzWidth]="720"
  [nzOkLoading]="isUploadingLogo"
  (nzOnOk)="handleSave()"
  (nzOnCancel)="handleCancel()">
  <form
    *nzModalContent
    nz-form
    [formGroup]="validateForm"
    [nzLayout]="'vertical'">
    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzRequired [nzNoColon]="true">
            Category Code
          </nz-form-label>
          <nz-form-control nzErrorTip="Category code is required!">
            <input
              nz-input
              formControlName="NewsCategoryId"
              placeholder="VD: doi-song" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzRequired [nzNoColon]="true">
            Vietnamese Name
          </nz-form-label>
          <nz-form-control nzErrorTip="Vietnamese name is required!">
            <input
              nz-input
              formControlName="NewsCategoryName"
              placeholder="VD: Đời sống" />
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label nzRequired [nzNoColon]="true">
            English Name
          </nz-form-label>
          <nz-form-control nzErrorTip="English name is required!">
            <input
              nz-input
              formControlName="NewsCategoryNameEn"
              placeholder="E.g. Lifestyle" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzNoColon]="true">Parent Category</nz-form-label>
          <nz-form-control>
            <nz-select
              formControlName="NewsCategoryParentId"
              nzAllowClear
              nzPlaceHolder="Không có (danh mục gốc)">
              <nz-option
                *ngFor="let c of selectableParents"
                [nzValue]="c.NewsCategoryId"
                [nzLabel]="c.NewsCategoryName"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzNoColon]="true">Sort Order</nz-form-label>
          <nz-form-control>
            <input
              nz-input
              type="number"
              formControlName="NewsCategoryIndex"
              placeholder="0" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzNoColon]="true">Category Logo</nz-form-label>
          <nz-form-control>
            <div class="category-logo-editor">
              <img
                *ngIf="logoUrl"
                class="category-logo-preview"
                [src]="logoUrl"
                alt="Category logo preview" />
              <nz-upload
                nzAccept="image/*"
                [nzShowUploadList]="false"
                [nzBeforeUpload]="handleUploadLogo">
                <button nz-button type="button" [disabled]="isUploadingLogo">
                  <span
                    nz-icon
                    [nzType]="isUploadingLogo ? 'loading' : 'upload'"></span>
                  {{ logoUrl ? 'Replace logo' : 'Upload logo' }}
                </button>
              </nz-upload>
              <button
                *ngIf="logoUrl"
                nz-button
                nzDanger
                type="button"
                (click)="handleRemoveLogo()">
                Remove
              </button>
            </div>
            <div class="category-logo-hint">Image file, maximum 5 MB.</div>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div nz-row [nzGutter]="16">
      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzNoColon]="true">Global</nz-form-label>
          <nz-form-control>
            <nz-switch formControlName="IsGlobal"></nz-switch>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col [nzSpan]="12">
        <nz-form-item>
          <nz-form-label [nzNoColon]="true">Active</nz-form-label>
          <nz-form-control>
            <nz-switch formControlName="FlagActive"></nz-switch>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </form>
</nz-modal>
