@if (canDelete) {
  @if (menuItem) {
    <div class="reel-delete-menu">
      <button
        type="button"
        class="reel-delete-menu__trigger"
        [class.is-open]="menuOpen"
        [disabled]="deleting"
        [attr.aria-expanded]="menuOpen"
        aria-haspopup="menu"
        (click)="toggleMenu($event)">
        <span nz-icon nzType="more" nzTheme="outline"></span>
      </button>
      @if (menuOpen) {
        <div
          class="reel-delete-menu__popover"
          role="menu"
          (click)="$event.stopPropagation()">
          <button type="button" role="menuitem" (click)="confirm()">
            <span nz-icon nzType="delete" nzTheme="outline"></span>
            <span>{{ 'T_REEL_DELETE' | translate }}</span>
          </button>
        </div>
      }
    </div>
  } @else {
    <button
      type="button"
      class="reel-delete"
      [class.reel-delete--compact]="compact"
      [disabled]="deleting"
      [attr.aria-label]="'T_REEL_DELETE' | translate"
      (click)="confirm()">
      <span
        class="reel-delete__icon"
        nz-icon
        nzType="delete"
        nzTheme="outline"
        aria-hidden="true"></span>
      @if (!compact) {
        <span class="reel-delete__label">{{
          'T_REEL_DELETE' | translate
        }}</span>
      }
    </button>
  }
}

<nz-modal
  nzClassName="blog-modal"
  [nzVisible]="open"
  [nzWidth]="440"
  [nzCentered]="true"
  [nzTitle]="'T_REEL_DELETE' | translate"
  [nzFooter]="footer"
  [nzClosable]="!deleting"
  [nzMaskClosable]="!deleting"
  [nzKeyboard]="!deleting"
  (nzOnCancel)="cancel()">
  <ng-container *nzModalContent>
    <p class="reel-delete__message">
      {{ 'T_REEL_DELETE_CONFIRM' | translate }}
    </p>
  </ng-container>
</nz-modal>
<ng-template #footer>
  <div class="reel-delete__footer">
    <button
      type="button"
      class="blog-btn"
      [disabled]="deleting"
      (click)="cancel()">
      {{ 'T_CANCEL' | translate }}
    </button>
    <button
      type="button"
      class="blog-btn blog-btn--danger"
      [disabled]="deleting"
      (click)="remove()">
      @if (deleting) {
        <span class="blog-spinner" aria-hidden="true"></span>
      }
      {{ (deleting ? 'T_LOADING' : 'T_REEL_DELETE') | translate }}
    </button>
  </div>
</ng-template>
