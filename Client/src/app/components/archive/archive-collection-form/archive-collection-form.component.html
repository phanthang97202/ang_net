<!-- nzClassName="blog-modal": khung modal ở styles.scss, cùng kiểu popup báo cáo bình luận -->
<nz-modal
  nzClassName="blog-modal"
  [nzAutofocus]="null"
  [nzVisible]="visible"
  [nzTitle]="isEdit ? 'Sửa bộ sưu tập' : 'Bộ sưu tập mới'"
  [nzMaskClosable]="!isSaving"
  [nzClosable]="!isSaving"
  [nzWidth]="560"
  (nzOnCancel)="close()">
  <form *nzModalContent class="collection-form" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label class="blog-label" for="collection-name">Tên bộ sưu tập</label>
      <input
        id="collection-name"
        class="blog-input"
        formControlName="Name"
        maxlength="150"
        placeholder="VD: Kỷ niệm Đà Lạt 2026, Kiến thức Angular..." />
      @if (form.controls.Name.touched && form.controls.Name.invalid) {
        <p class="collection-form__error">Vui lòng nhập tên (tối đa 150 ký tự)</p>
      }
    </div>

    <div>
      <label class="blog-label" for="collection-description">
        Mô tả <span class="blog-label__optional">(không bắt buộc)</span>
      </label>
      <textarea
        id="collection-description"
        class="blog-input"
        formControlName="Description"
        rows="3"
        maxlength="2000"
        placeholder="Bộ sưu tập này lưu gì?"></textarea>
    </div>

    <div>
      <span class="blog-label" id="collection-visibility">Ai được xem?</span>
      <!-- Radio thật (ẩn) bọc trong label: giữ điều hướng phím mũi tên của nhóm radio -->
      <div class="collection-form__options" role="radiogroup" aria-labelledby="collection-visibility">
        @for (option of visibilityOptions; track option.value) {
          <label
            class="collection-form__option"
            [class.is-active]="form.controls.Visibility.value === option.value">
            <input
              class="collection-form__radio"
              type="radio"
              formControlName="Visibility"
              [value]="option.value" />
            <span class="collection-form__option-icon">
              <span nz-icon [nzType]="option.icon" nzTheme="outline"></span>
            </span>
            <strong>{{ option.label }}</strong>
            <small>{{ option.description }}</small>
          </label>
        }
      </div>
    </div>

    <!-- Enter trong ô tên vẫn submit được -->
    <button type="submit" hidden></button>
  </form>

  <div *nzModalFooter class="collection-form__footer">
    <button type="button" class="blog-btn" [disabled]="isSaving" (click)="close()">Huỷ</button>
    <button type="button" class="blog-btn blog-btn--primary" [disabled]="isSaving" (click)="submit()">
      @if (isSaving) {
        <span class="blog-spinner" aria-hidden="true"></span>
        Đang lưu...
      } @else {
        {{ isEdit ? 'Lưu thay đổi' : 'Tạo bộ sưu tập' }}
      }
    </button>
  </div>
</nz-modal>
